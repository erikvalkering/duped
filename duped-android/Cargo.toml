[package]
name = "duped-android"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.9", features = ["backend-android-activity-06"] }
duped = { path = ".." }  # only if you want to reuse duped logic; otherwise omit

[package.metadata.android]
package = "com.example.duped"
label = "Duped"
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.signing.release]
path = "../signing/duped-release.keystore"  # path relative to this Cargo.toml
keystore_password = { env = "SIGNING_STORE_PASSWORD" }
key_password = { env = "SIGNING_KEY_PASSWORD" }
key_alias = { env = "SIGNING_KEY_ALIAS" }
