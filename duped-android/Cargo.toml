[package]
name = "duped-android"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
winit = "0.31.0-beta.3"
android_logger = "0.15.1"
eframe = "0.35.0"
log = "0.4.34"

android-build = { version = "0.1.4", default-features = false }
anyhow = "1.0.104"
cargo-subcommand = "0.12.0"
clap = "4.6.7"
dirs = "6.0.0"
dunce = "1.0.5"
env_logger = "0.11.11"
jni = "0.22.4"
libc = "1.0.0-alpha.4"
ndk = "0.9.0"
ndk-context = "0.1.1"
quick-xml = "0.41.0"
serde = "1.0.229"
thiserror = "2.0.21"
toml = "1.1.6"
which = "8.0.6"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 37

# This needs to be turned on for cargo apk2.
[package.metadata.android.application]
# needed
has_code = false

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

