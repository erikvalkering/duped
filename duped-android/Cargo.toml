[package]
name = "duped-android"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
walkdir = "2"
jni = "0.21"
url = "2"

[build-dependencies]
slint-build = { version = "1.18" }

[package.metadata.android]
package = "com.example.duped"
build_targets = ["aarch64-linux-android"]
resources = "res"
manifest_override = "AndroidManifest.xml"

# Confirm the exact Java-source metadata key required by your installed
# cargo-apk2 version. This directory must contain
# java/com/example/duped/MainActivity.java.
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
has_code = true
label = "Duped"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = "com.example.duped.MainActivity"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "duped_android"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
