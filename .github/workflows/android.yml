name: Build Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  RUST_TARGET: "aarch64-linux-android"
  APK_DIR: "duped-android/target/release/apk"

jobs:
  build:
    name: Build, sign, verify, and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set Android version from tag
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "Expected a tag like v0.1.2; got ${GITHUB_REF_NAME}"
            exit 1
          fi

          # Map semver major.minor.patch to Android's positive integer versionCode.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"

          if (( MAJOR > 2097 || MINOR > 999 || PATCH > 999 )); then
            echo "Version component too large for versionCode mapping"
            exit 1
          fi

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH + 1))

          # Update existing entries, or append them to [package.metadata.android].
          if grep -q '^version_name[[:space:]]*=' Cargo.toml; then
            sed -i -E "s/^version_name[[:space:]]*=.*/version_name = "$VERSION"/" Cargo.toml
          else
            sed -i '/^[package.metadata.android]/a version_name = "'"$VERSION"'"' Cargo.toml
          fi

          if grep -q '^version_code[[:space:]]*=' Cargo.toml; then
            sed -i -E "s/^version_code[[:space:]]*=.*/version_code = $VERSION_CODE/" Cargo.toml
          else
            sed -i '/^[package.metadata.android]/a version_code = '"$VERSION_CODE" Cargo.toml
          fi

          grep -A4 '^[package.metadata.android]' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Show Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --version
          adb version

      - name: Install cargo-apk2
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-apk2 --locked

      - name: Restore release signing keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          mkdir -p signing

          printf '%s' "$SIGNING_KEY" \
            | base64 --decode \
            > signing/duped-release.keystore

          test -s signing/duped-release.keystore

      - name: Verify release keystore
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore signing/duped-release.keystore \
            -storepass "$SIGNING_STORE_PASSWORD"

      - name: Inject release signing configuration
        working-directory: duped-android
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cat >> Cargo.toml <<EOF

          [package.metadata.android.signing.release]
          path = "../signing/duped-release.keystore"
          keystore_password = "${SIGNING_STORE_PASSWORD}"
          key_password = "${SIGNING_KEY_PASSWORD}"
          key_alias = "${SIGNING_KEY_ALIAS}"
          EOF

      - name: Display effective Android metadata
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail

          grep -n -A80 \
            'package.metadata.android' \
            Cargo.toml

      - name: Build signed release APK
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail

          cargo apk2 build \
            --release \
            --target "${{ env.RUST_TARGET }}"

      - name: Locate final APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          echo "APK files produced:"
          find "${{ env.APK_DIR }}" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          mapfile -d '' -t CANDIDATES < <(
            find "${{ env.APK_DIR }}" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              ! -name "*unaligned*.apk" \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "Expected exactly one final APK."
            echo "Found ${#CANDIDATES[@]} candidates:"
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          FINAL_APK="${CANDIDATES[0]}"

          echo "Selected APK: ${FINAL_APK}"

          cp "${FINAL_APK}" duped.apk
          test -s duped.apk

          echo "path=duped.apk" >> "$GITHUB_OUTPUT"

      - name: Inspect APK contents
        shell: bash
        run: |
          set -euo pipefail

          unzip -l "${{ steps.apk.outputs.path }}" \
            | grep -E \
              'AndroidManifest.xml|lib/.+.so' \
            || true

      - name: Inspect APK metadata
        shell: bash
        run: |
          set -euo pipefail

          AAPT="${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/aapt"

          test -x "${AAPT}"

          echo "APK badging:"
          "${AAPT}" dump badging duped.apk

          echo "APK permissions:"
          "${AAPT}" dump permissions duped.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner"

          test -x "${APKSIGNER}"

          "${APKSIGNER}" verify \
            --verbose \
            --print-certs \
            duped.apk

      - name: Calculate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum duped.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duped-android-release
          path: duped.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duped ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: duped.apk
