name: Build Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  RUST_TARGET: "aarch64-linux-android"
  APK_DIR: "duped-android/target/release/apk"

jobs:
  build:
    name: Build, sign, verify, and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Show Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --version
          adb version

      - name: Install cargo-apk2
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-apk2 --locked

      - name: Restore release signing keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          mkdir -p signing

          printf '%s' "$SIGNING_KEY" \
            | base64 --decode \
            > signing/duped-release.keystore

          test -s signing/duped-release.keystore

      - name: Verify release keystore
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore signing/duped-release.keystore \
            -storepass "$SIGNING_STORE_PASSWORD"

      - name: Inject Android application metadata
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail

          cat >> Cargo.toml <<'EOF'

          [package.metadata.android]
          package = "com.example.duped"
          build_targets = ["aarch64-linux-android"]

          [package.metadata.android.sdk]
          min_sdk_version = 29
          target_sdk_version = 35

          [package.metadata.android.application]
          has_code = false

          [[package.metadata.android.application.activity]]
          name = "android.app.NativeActivity"
          exported = true

          [[package.metadata.android.application.activity.meta_data]]
          name = "android.app.lib_name"
          value = "duped_android"

          [[package.metadata.android.application.activity.intent_filter]]
          actions = ["android.intent.action.MAIN"]
          categories = ["android.intent.category.LAUNCHER"]
          EOF

      - name: Inject release signing configuration
        working-directory: duped-android
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cat >> Cargo.toml <<EOF

          [package.metadata.android.signing.release]
          path = "../signing/duped-release.keystore"
          keystore_password = "${SIGNING_STORE_PASSWORD}"
          key_password = "${SIGNING_KEY_PASSWORD}"
          key_alias = "${SIGNING_KEY_ALIAS}"
          EOF

      - name: Display effective Android metadata
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail

          grep -n -A80 \
            'package.metadata.android' \
            Cargo.toml

      - name: Build signed release APK
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail

          cargo apk2 build \
            --release \
            --target "${RUST_TARGET}"

      - name: Locate final APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          echo "APK files produced:"
          find "${APK_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          mapfile -d '' -t CANDIDATES < <(
            find "${APK_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              ! -name "*unaligned*.apk" \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "Expected exactly one final APK."
            echo "Found ${#CANDIDATES[@]} candidates:"
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          FINAL_APK="${CANDIDATES[0]}"

          echo "Selected APK: ${FINAL_APK}"

          cp "${FINAL_APK}" duped.apk
          test -s duped.apk

          echo "path=duped.apk" >> "$GITHUB_OUTPUT"

      - name: Inspect APK contents
        shell: bash
        run: |
          set -euo pipefail

          unzip -l "${{ steps.apk.outputs.path }}" \
            | grep -E \
              'AndroidManifest.xml|lib/.+.so' \
            || true

      - name: Inspect APK metadata
        shell: bash
        run: |
          set -euo pipefail

          AAPT="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"

          test -x "${AAPT}"

          echo "APK badging:"
          "${AAPT}" dump badging duped.apk

          echo "APK permissions:"
          "${AAPT}" dump permissions duped.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          test -x "${APKSIGNER}"

          "${APKSIGNER}" verify \
            --verbose \
            --print-certs \
            duped.apk

      - name: Calculate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum duped.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duped-android-release
          path: duped.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duped ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: duped.apk
