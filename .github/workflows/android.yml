name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main # Change this if your default branch has another name.
    tags:
      - "v*"

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  RUST_TARGET: "aarch64-linux-android"
  APK_DIR: "duped-android/target/release/apk"

jobs:
  build:
    name: Build, sign, verify, and publish APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set Android version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like v0.1.2; got ${GITHUB_REF_NAME}"
            exit 1
          fi

          # Map semver major.minor.patch to Android's positive integer versionCode.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"

          if (( MAJOR > 2097 || MINOR > 999 || PATCH > 999 )); then
            echo "Version component too large for versionCode mapping"
            exit 1
          fi

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH + 1))

          # Update existing entry.
          sed -i -E "s/^version[[:space:]]*=.*/version = \"$VERSION\"/" Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Identify Rust compiler
        id: rust
        shell: bash
        run: echo "id=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Configure cached tool paths
        shell: bash
        run: |
          echo "ANDROID_HOME=$HOME/.cache/duped-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.cache/duped-android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/.cache/duped-cargo-apk2/bin" >> "$GITHUB_PATH"
          echo "CARGO_INCREMENTAL=1" >> "$GITHUB_ENV"

      - name: Cache Android SDK
        id: android-sdk
        uses: actions/cache@v4
        with:
          path: ~/.cache/duped-android-sdk
          key: android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up Android SDK
        if: steps.android-sdk.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Restore Android executable paths
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

      - name: Cache cargo-apk2 installation
        id: cargo-apk2
        uses: actions/cache@v4
        with:
          path: ~/.cache/duped-cargo-apk2
          key: cargo-apk2-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24

      - name: Install cargo-apk2
        if: steps.cargo-apk2.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install cargo-apk2 --locked --root "$HOME/.cache/duped-cargo-apk2"

      - name: Restore Cargo dependencies and compilation state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/**/release/deps
            target/**/release/build
            target/**/release/incremental
            target/**/release/.fingerprint
          key: android-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.id }}-${{ env.RUST_TARGET }}-${{ env.ANDROID_API_LEVEL }}-${{ hashFiles('**/Cargo.lock', '**/.cargo/config*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.id }}-${{ env.RUST_TARGET }}-${{ env.ANDROID_API_LEVEL }}-${{ hashFiles('**/Cargo.lock', '**/.cargo/config*') }}-
            android-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.id }}-${{ env.RUST_TARGET }}-${{ env.ANDROID_API_LEVEL }}-

      - name: Restore release signing keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          mkdir -p signing

          printf '%s' "$SIGNING_KEY" \
            | base64 --decode \
            > signing/duped-release.keystore

          test -s signing/duped-release.keystore

      - name: Verify release keystore
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore signing/duped-release.keystore \
            -storepass "$SIGNING_STORE_PASSWORD"

      - name: Inject release signing configuration
        working-directory: duped-android
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cat >> Cargo.toml <<EOF

          [package.metadata.android.signing.release]
          path = "../signing/duped-release.keystore"
          keystore_password = "$SIGNING_STORE_PASSWORD"
          key_password = "$SIGNING_KEY_PASSWORD"
          key_alias = "$SIGNING_KEY_ALIAS"
          EOF

      - name: Generate explicit Android manifest
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)

          def a(name):
              return f"{{{android}}}{name}"

          config = tomllib.loads(Path("Cargo.toml").read_text())
          version = config["package"]["version"]
          major, minor, patch = map(int, version.split("."))

          # Offset the existing workflow's mapping above the published 0.0.108 code.
          version_code = 16777216 + major * 1000000 + minor * 1000 + patch + 1

          if not 1 <= version_code <= 2100000000:
              raise SystemExit("Android versionCode out of range")

          manifest = ET.Element(
              "manifest",
              {
                  "package": config["package"]["metadata"]["android"]["package"],
                  a("versionCode"): str(version_code),
                  a("versionName"): version,
              },
          )

          ET.SubElement(
              manifest,
              "uses-sdk",
              {
                  a("minSdkVersion"): "29",
                  a("targetSdkVersion"): "35",
              },
          )

          ET.SubElement(
              manifest,
              "uses-permission",
              {a("name"): "android.permission.MANAGE_EXTERNAL_STORAGE"},
          )

          app = ET.SubElement(
              manifest,
              "application",
              {
                  a("label"): "Duped",
                  a("icon"): "@mipmap/ic_launcher",
                  a("hasCode"): "true",
                  a("debuggable"): "false",
              },
          )

          activity = ET.SubElement(
              app,
              "activity",
              {
                  a("name"): f"{manifest.attrib['package']}.MainActivity",
                  a("exported"): "true",
                  a("configChanges"): "orientation|keyboardHidden|screenSize",
              },
          )

          ET.SubElement(
              activity,
              "meta-data",
              {
                  a("name"): "android.app.lib_name",
                  a("value"): "duped_android",
              },
          )

          intent = ET.SubElement(activity, "intent-filter")
          ET.SubElement(intent, "action", {a("name"): "android.intent.action.MAIN"})
          ET.SubElement(intent, "category", {a("name"): "android.intent.category.LAUNCHER"})

          ET.indent(manifest)
          ET.ElementTree(manifest).write(
              "AndroidManifest.xml",
              encoding="utf-8",
              xml_declaration=True,
          )

          print(Path("AndroidManifest.xml").read_text())
          PY

      - name: Build signed release APK
        shell: bash
        working-directory: duped-android
        run: |
          set -euo pipefail

          # Build the Android workspace member from the repository root so that
          # its path dependency on the root `duped` crate is resolved correctly.
          cargo apk2 build --release --target "$RUST_TARGET"

      - name: Locate final APK
        id: apk
        shell: bash
        working-directory: duped-android
        run: |
          set -euo pipefail

          echo "APK files produced:"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print

          mapfile -d '' -t CANDIDATES < <(
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' ! -name '*unaligned.apk' -print0
          )

          if (( ${#CANDIDATES[@]} != 1 )); then
            echo "Expected exactly one final APK."
            echo "Found ${#CANDIDATES[@]} candidates:"
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          FINAL_APK="${CANDIDATES[0]}"
          echo "Selected APK: $FINAL_APK"

          cp "$FINAL_APK" duped.apk
          test -s duped.apk
          echo "path=duped.apk" >> "$GITHUB_OUTPUT"

      - name: Inspect APK contents
        shell: bash
        working-directory: duped-android
        run: |
          set -euo pipefail

          unzip -l "${{ steps.apk.outputs.path }}" \
            | grep -E \
              'AndroidManifest.xml|lib/.+\.so' \
            || true

      - name: Inspect APK metadata
        shell: bash
        working-directory: duped-android
        run: |
          set -euo pipefail

          AAPT="${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/aapt"

          test -x "$AAPT"

          echo "APK badging:"
          "$AAPT" dump badging duped.apk

          echo "APK permissions:"
          "$AAPT" dump permissions duped.apk

          echo "APK manifest:"
          "$AAPT" dump xmltree duped.apk AndroidManifest.xml

      - name: Verify APK signature
        shell: bash
        working-directory: duped-android
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            duped.apk

      - name: Calculate APK checksum
        shell: bash
        working-directory: duped-android
        run: |
          set -euo pipefail
          sha256sum duped.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        working-directory: duped-android
        with:
          name: duped-android-release
          path: duped.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duped ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: duped.apk
