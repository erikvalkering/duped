name: Build Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, verify, and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Restore signing keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$SIGNING_KEY" | base64 --decode > signing/duped-release.keystore
          test -s signing/duped-release.keystore

      - name: Inject release signing configuration
        working-directory: duped-android
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat >> Cargo.toml <<EOF

          [package.metadata.android.signing.release]
          path = "../signing/duped-release.keystore"
          keystore_password = "${SIGNING_STORE_PASSWORD}"
          key_password = "${SIGNING_KEY_PASSWORD}"
          key_alias = "${SIGNING_KEY_ALIAS}"
          EOF

      - name: Build signed release APK
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail
          cargo apk run --target aarch64-linux-android

      - name: Select and verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="duped-android/target/release/apk"

          echo "All APK files produced:"
          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print

          mapfile -d '' -t CANDIDATES < <(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              ! -name "*unaligned*.apk" \
              -print0
          )

          CANDIDATE_COUNT="${#CANDIDATES[@]}"

          echo "Final APK candidate count: $CANDIDATE_COUNT"
          echo "Final APK candidates:"
          printf '%s\n' "${CANDIDATES[@]}"

          if [ "$CANDIDATE_COUNT" -ne 1 ]; then
            echo "Expected exactly one signed/aligned APK candidate."
            echo "Refusing to choose an APK automatically."
            exit 1
          fi

          FINAL_APK="${CANDIDATES[0]}"

          echo "Using final APK: $FINAL_APK"
          cp "$FINAL_APK" duped.apk
          test -s duped.apk

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$APKSIGNER" verify --verbose --print-certs duped.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duped ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: duped.apk
