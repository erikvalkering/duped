name: Build Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked

      - name: Restore signing keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$SIGNING_KEY" | base64 --decode > signing/duped-release.keystore
          test -s signing/duped-release.keystore

      - name: Inject release signing configuration
        working-directory: duped-android
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat >> Cargo.toml <<EOF

          [package.metadata.android.signing.release]
          path = "../signing/duped-release.keystore"
          keystore_password = "${SIGNING_STORE_PASSWORD}"
          key_password = "${SIGNING_KEY_PASSWORD}"
          key_alias = "${SIGNING_KEY_ALIAS}"
          EOF

      - name: Build signed release APK
        working-directory: duped-android
        shell: bash
        run: |
          set -euo pipefail
          cargo apk2 build --release

      - name: Select and verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="duped-android/target/release/apk"

          echo "APK files produced:"
          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk"

          FINAL_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*unaligned*.apk" | head -n 1)"

          if [ -z "$FINAL_APK" ]; then
            echo "No final APK was found."
            exit 1
          fi

          echo "Using final APK: $FINAL_APK"
          cp "$FINAL_APK" duped.apk
          test -s duped.apk

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$APKSIGNER" verify --verbose --print-certs duped.apk

      - name: Show APK metadata
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKANALYZER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apkanalyzer"

          echo "Package ID:"
          "$APKANALYZER" manifest application-id duped.apk

          echo "Version code:"
          "$APKANALYZER" manifest version-code duped.apk

          echo "Version name:"
          "$APKANALYZER" manifest version-name duped.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duped ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: duped.apk
