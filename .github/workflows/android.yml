name: Build Android Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk2
        run: cargo install cargo-apk2

      - name: Prepare keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signing/duped-release.keystore

      - name: Patch Cargo.toml with signing config
        working-directory: duped-android
        run: |
          cat >> Cargo.toml << 'EOF'

          [package.metadata.android.signing.release]
          path = "../signing/duped-release.keystore"
          keystore_password = "${{ secrets.SIGNING_STORE_PASSWORD }}"
          key_password = "${{ secrets.SIGNING_KEY_PASSWORD }}"
          key_alias = "${{ secrets.SIGNING_KEY_ALIAS }}"
          EOF

      - name: Build release APK
        working-directory: duped-android
        run: cargo apk2 build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: duped-android/target/release/apk/*.apk
